name: Official Lox Tests

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  official-tests:
    name: ${{ matrix.impl }} official tests (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - impl: jlox
            language: Java
            needs_native: false
            needs_llvm: false
          - impl: loxpp
            language: C++23
            needs_native: true
            needs_llvm: false
          - impl: clox
            language: C99
            needs_native: true
            needs_llvm: false
          - impl: cpplox
            language: C++20
            needs_native: true
            needs_llvm: false
          - impl: eloxir
            language: C++17 + LLVM ORC JIT
            needs_native: true
            needs_llvm: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.impl == 'jlox'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        if: matrix.impl == 'jlox'
        uses: gradle/actions/setup-gradle@v4

      - name: Install native toolchain
        if: matrix.needs_native
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake

      - name: Install LLVM
        if: matrix.needs_llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-dev \
            llvm-runtime

      - name: Show implementation metadata
        run: ./lox.py info ${{ matrix.impl }}

      - name: Check toolchain
        run: ./lox.py doctor ${{ matrix.impl }}

      - name: Build ${{ matrix.impl }}
        run: ./lox.py build ${{ matrix.impl }}

      - name: Run official Lox tests
        run: ./lox.py test ${{ matrix.impl }} --skip-build --timeout 600 --timings 10 --show-skips
